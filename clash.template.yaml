{
  "mode": "rule",
  "log-level": "info",
  "proxies": [],
  "proxy-groups": [
    {
      "name": "AI",
      "type": "select",
      "proxies": [
        "REJECT"
      ]
    },
    {
      "name": "Normal",
      "type": "select",
      "proxies": [
        "REJECT"
      ]
    },
    {
      "name": "Unmatched",
      "type": "select",
      "proxies": [
        "Normal",
        "DIRECT"
      ]
    }
  ],
  "rule-providers": {
    "ai": {
      "type": "http",
      "behavior": "classical",
      "url": "https://raw.githubusercontent.com/zzz7491/smart-routing/main/rules/ai.yaml",
      "path": "./rules/smart-ai.yaml",
      "interval": 86400
    },
    "cloudflare": {
      "type": "http",
      "behavior": "classical",
      "url": "https://raw.githubusercontent.com/zzz7491/smart-routing/main/rules/cloudflare.yaml",
      "path": "./rules/smart-cloudflare.yaml",
      "interval": 86400
    },
    "direct": {
      "type": "http",
      "behavior": "classical",
      "url": "https://raw.githubusercontent.com/zzz7491/smart-routing/main/rules/direct.yaml",
      "path": "./rules/smart-direct.yaml",
      "interval": 86400
    },
    "normal-proxy": {
      "type": "http",
      "behavior": "classical",
      "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.yaml",
      "path": "./rules/normal-proxy.yaml",
      "interval": 86400
    },
    "china-domain": {
      "type": "http",
      "behavior": "domain",
      "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml",
      "path": "./rules/china-domain.yaml",
      "interval": 86400
    }
  },
  "rules": [
    "RULE-SET,ai,AI",
    "RULE-SET,cloudflare,DIRECT",
    "RULE-SET,direct,DIRECT",
    "RULE-SET,china-domain,DIRECT",
    "RULE-SET,normal-proxy,Normal,no-resolve",
    "GEOIP,CN,DIRECT",
    "MATCH,Unmatched"
  ]
}
